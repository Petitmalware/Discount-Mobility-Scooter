# Install only after checking this port, certificate paths and existing vhosts.
# Do not replace nginx.conf or another website's server block.
server {
    listen 80;
    server_name discountmobilityscooter.com;
    location /.well-known/acme-challenge/ { root /var/www/discount-mobility-scooter-acme; }
    location / { return 301 https://discountmobilityscooter.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name discountmobilityscooter.com;
    ssl_certificate /etc/letsencrypt/live/discountmobilityscooter.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/discountmobilityscooter.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 96k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    access_log /var/log/nginx/discount-mobility-scooter.access.log;
    error_log /var/log/nginx/discount-mobility-scooter.error.log warn;

    location ~ /\. { return 404; }
    location ~* \.(sqlite|db|env|sql|bak)$ { return 404; }
    limit_req_status 429;
    location = /api/admin/login { limit_req zone=dms_login burst=4 nodelay; proxy_pass http://127.0.0.1:3187; }
    location /api/ { limit_req zone=dms_requests burst=30 nodelay; proxy_pass http://127.0.0.1:3187; }
    location / { proxy_pass http://127.0.0.1:3187; }
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host discountmobilityscooter.com;
        proxy_set_header X-Forwarded-Host discountmobilityscooter.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header oai-authenticated-user-id "";
        proxy_set_header oai-authenticated-user-email "";
        proxy_set_header oai-authenticated-user-full-name "";
        proxy_set_header oai-authenticated-user-full-name-encoding "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;
        proxy_hide_header X-Powered-By;
}
